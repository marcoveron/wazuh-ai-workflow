[project]
name = "wazuh-mcp"
version = "0.1.0"
description = "MCP server that exposes a Wazuh SIEM to LLMs (read-only)"
readme = "README.md"
authors = [
    { name = "marcoveron", email = "mv.marcoveron@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
wazuh-mcp = "wazuh_mcp:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
